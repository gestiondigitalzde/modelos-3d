<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámara Kiosco</title>
    <style>
        body { 
            margin: 0; padding: 0; background-color: #000; color: white;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden;
            font-family: sans-serif;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .controles {
            position: absolute; bottom: 0; width: 100%; padding: 20px;
            display: flex; justify-content: center;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
        }
        .btn-capturar {
            width: 75px; height: 75px; border-radius: 50%;
            border: 5px solid white; background-color: #00a9e0;
            cursor: pointer; outline: none; transition: transform 0.1s;
        }
        .btn-capturar:active { transform: scale(0.9); }
        #mensaje { position: absolute; top: 40%; width: 100%; text-align: center; display: none; padding: 20px; box-sizing: border-box; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    
    <div id="mensaje">
        <h2 style="color: #ff4757;">Cámara bloqueada</h2>
        <p>Por favor, haz clic en el candado de la barra de direcciones y permite el uso de la cámara.</p>
    </div>

    <div class="controles">
        <button class="btn-capturar" onclick="tomarFoto()"></button>
    </div>

    <script>
        const video = document.getElementById('video');
        const mensaje = document.getElementById('mensaje');
        const btn = document.querySelector('.btn-capturar');

        // 1. Encender la cámara al abrir la ventana
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: {ideal: 1280}, height: {ideal: 720} } })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Error de cámara:", err);
                video.style.display = 'none';
                btn.style.display = 'none';
                mensaje.style.display = 'block';
            });

        // 2. Tomar foto y mandarla a Google
        function tomarFoto() {
            // Dibujar el video en un canvas (lienzo)
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            // Convertir a texto Base64
            const fotoBase64 = canvas.toDataURL('image/jpeg', 0.8);
            
            // MAGIA: Enviar la foto a la ventana que abrió este pop-up (Tu ERP)
            if (window.opener) {
                window.opener.postMessage({ tipo: 'FOTO_KIOSCO_OK', foto: fotoBase64 }, '*');
            }
            
            // Apagar la luz de la cámara y cerrar la ventanita
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
            }
            window.close();
        }
    </script>
</body>
</html>
