<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lector QR - ERP Zúñiga</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #video {
            width: 100%; height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        canvas { display: none; }

        #flash {
            position: absolute;
            inset: 0;
            opacity: 0;
            z-index: 20;
            pointer-events: none;
            transition: opacity 0.15s;
        }

        .overlay-top {
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: 10;
            padding: 14px 18px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-text {
            font-size: 0.85rem;
            font-weight: 800;
            color: #00a9e0;
            letter-spacing: 1px;
        }

        .btn-switch {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 1.5px solid rgba(255,255,255,0.4);
            background: rgba(0,0,0,0.4);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(6px);
            touch-action: manipulation;
            transition: background 0.2s;
        }
        .btn-switch:active { background: rgba(0,169,224,0.4); }

        /* MARCO ESCÁNER */
        .scan-frame {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -58%);
            width: clamp(180px, 50vw, 240px);
            height: clamp(180px, 50vw, 240px);
            z-index: 5;
            pointer-events: none;
        }

        .scan-frame::before, .scan-frame::after,
        .corner { 
            content: '';
            position: absolute;
            width: clamp(30px, 8vw, 40px);
            height: clamp(30px, 8vw, 40px);
            border-color: #00a9e0;
            border-style: solid;
        }
        .scan-frame::before {
            top: 0; left: 0;
            border-width: 3px 0 0 3px;
            border-radius: 4px 0 0 0;
        }
        .scan-frame::after {
            bottom: 0; right: 0;
            border-width: 0 3px 3px 0;
            border-radius: 0 0 4px 0;
        }
        .corner { position: absolute; }
        .corner.tr {
            top: 0; right: 0;
            border-width: 3px 3px 0 0;
            border-radius: 0 4px 0 0;
        }
        .corner.bl {
            bottom: 0; left: 0;
            border-width: 0 0 3px 3px;
            border-radius: 0 0 0 4px;
        }

        .scan-line {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -58%);
            width: clamp(180px, 50vw, 240px);
            height: 2px;
            background: linear-gradient(to right, transparent, #00a9e0, transparent);
            z-index: 6;
            pointer-events: none;
            animation: scanAnim 2s ease-in-out infinite;
        }

        @keyframes scanAnim {
            0%   { margin-top: -90px; }
            50%  { margin-top:  90px; }
            100% { margin-top: -90px; }
        }

        .overlay-bottom {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
            padding: 16px 20px 28px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            text-align: center;
        }

        .scan-status {
            font-size: clamp(0.78rem, 3vw, 0.92rem);
            font-weight: 700;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.5px;
        }

        .scan-status.ok {
            color: #22c55e;
            font-size: clamp(0.9rem, 3.5vw, 1.1rem);
            animation: blink 0.4s ease-in-out 3;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        #error-camara {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 30;
            background: #0a0a0a;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 28px;
        }
        #error-camara p {
            font-size: clamp(0.85rem, 3.5vw, 1rem);
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }
        .btn-reintentar {
            padding: 10px 28px;
            border-radius: 20px;
            border: none;
            background: #00a9e0;
            color: white;
            font-weight: 800;
            cursor: pointer;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="flash"></div>

<div class="overlay-top">
    <span class="logo-text">ERP ZÚÑIGA — Lector QR</span>
    <button class="btn-switch" onclick="cambiarCamara()" title="Cambiar cámara">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="white">
            <path d="M20 5h-3.17L15 3H9L7.17 5H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-8 13c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
    </button>
</div>

<div class="scan-frame">
    <div class="corner tr"></div>
    <div class="corner bl"></div>
</div>
<div class="scan-line"></div>

<div class="overlay-bottom">
    <p class="scan-status" id="status-text">
        Apunta el QR de tu carnet hacia la cámara
    </p>
</div>

<div id="error-camara">
    <p style="font-size:2.5rem;">📷</p>
    <p>No se pudo acceder a la cámara.<br>Permite el acceso e intenta de nuevo.</p>
    <button class="btn-reintentar" onclick="encenderCamara()">Reintentar</button>
</div>

<script>
    const video      = document.getElementById('video');
    const canvas     = document.getElementById('canvas');
    const flash      = document.getElementById('flash');
    const statusText = document.getElementById('status-text');
    const errorDiv   = document.getElementById('error-camara');

    let currentStream = null;
    let modoCamara    = 'environment';
    let escaneando    = true;
    let qrDetectado   = false;
    let animFrameId   = null;

    // 1. ENCENDER CÁMARA
    async function encenderCamara() {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());
        errorDiv.style.display = 'none';

        try {
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: modoCamara, width: { ideal: 1280 }, height: { ideal: 720 } }
            });
            video.srcObject = currentStream;
            await video.play();
            iniciarEscaneo();
        } catch(err) {
            console.error(err);
            errorDiv.style.display = 'flex';
        }
    }

    // 2. ESCANEO CONTINUO
    function iniciarEscaneo() {
        if (animFrameId) cancelAnimationFrame(animFrameId);
        escaneando  = true;
        qrDetectado = false;

        function tick() {
            if (!escaneando) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width  = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'dontInvert'
                });

                if (code && code.data && !qrDetectado) {
                    const texto = code.data.trim();
                    if (texto.startsWith('ERP-')) {
                        qrDetectado = true;
                        escaneando  = false;
                        onQRDetectado(texto);
                        return;
                    }
                }
            }
            animFrameId = requestAnimationFrame(tick);
        }

        animFrameId = requestAnimationFrame(tick);
    }

    // 3. QR DETECTADO
    function onQRDetectado(codigo) {
        // Flash verde
        flash.style.background = 'rgba(34,197,94,0.4)';
        flash.style.opacity = '1';
        setTimeout(() => { flash.style.opacity = '0'; }, 300);

        statusText.innerText = '✓ QR detectado — cerrando...';
        statusText.classList.add('ok');

        // Mandar al ERP y cerrar
        if (window.opener) {
            window.opener.postMessage({ tipo: 'QR_KIOSCO_OK', codigo: codigo }, '*');
        }

        setTimeout(() => {
            if (currentStream) currentStream.getTracks().forEach(t => t.stop());
            window.close();
        }, 800);
    }

    // 4. CAMBIAR CÁMARA
    function cambiarCamara() {
        modoCamara = modoCamara === 'user' ? 'environment' : 'user';
        encenderCamara();
    }

    encenderCamara();
</script>
</body>
</html>
